<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — SegmentIQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-page">

  <div class="auth-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="grid-overlay"></div>
  </div>

  <a href="index.html" class="auth-back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    Back to home
  </a>

  <div class="auth-wrap auth-wrap-wide">
    <div class="auth-brand">
      <a href="index.html" class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="10" cy="10" r="6" fill="#6366f1" opacity="0.9"/>
            <circle cx="23" cy="12" r="4.5" fill="#22d3ee" opacity="0.85"/>
            <circle cx="15" cy="23" r="5" fill="#a855f7" opacity="0.85"/>
            <circle cx="16" cy="16" r="1.6" fill="#fff"/>
          </svg>
        </span>
        <span class="brand-name">Segment<span class="brand-accent">IQ</span></span>
      </a>
    </div>

    <div class="auth-card">
      <div class="stepper">
        <div class="stepper-track"><div class="stepper-fill" id="stepperFill"></div></div>
        <div class="stepper-dots">
          <div class="stepper-dot active" data-step="1"><span>1</span><em>Account</em></div>
          <div class="stepper-dot" data-step="2"><span>2</span><em>Company</em></div>
          <div class="stepper-dot" data-step="3"><span>3</span><em>Plan</em></div>
        </div>
      </div>

      <h1>Create your account</h1>
      <p class="auth-sub">Start your 14-day free trial. No credit card required.</p>

      <form id="registerForm" novalidate>
        <!-- STEP 1 -->
        <div class="form-step active" data-step="1">
          <div class="form-row">
            <div class="form-group">
              <label for="regName">Full name</label>
              <input type="text" id="regName" name="name" placeholder="Jane Doe" autocomplete="name" required />
              <span class="field-error" data-for="regName"></span>
            </div>
            <div class="form-group">
              <label for="regEmail">Work email</label>
              <input type="email" id="regEmail" name="email" placeholder="you@company.com" autocomplete="email" required />
              <span class="field-error" data-for="regEmail"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="regPassword">Password</label>
            <div class="input-wrap">
              <input type="password" id="regPassword" name="password" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8" />
              <button type="button" class="toggle-pw" data-target="regPassword" aria-label="Show password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="pw-strength" id="pwStrength">
              <div class="pw-bars"><i></i><i></i><i></i><i></i></div>
              <span class="pw-label">Password strength</span>
            </div>
            <span class="field-error" data-for="regPassword"></span>
          </div>

          <div class="form-group">
            <label for="regConfirm">Confirm password</label>
            <input type="password" id="regConfirm" name="confirm" placeholder="Re-enter your password" autocomplete="new-password" required />
            <span class="field-error" data-for="regConfirm"></span>
          </div>

          <div class="step-actions">
            <button type="button" class="btn btn-primary btn-block btn-lg" data-next="2">Continue</button>
          </div>
        </div>

        <!-- STEP 2 -->
        <div class="form-step" data-step="2">
          <div class="form-group">
            <label for="regCompany">Company name</label>
            <input type="text" id="regCompany" name="company" placeholder="Acme Inc." required />
            <span class="field-error" data-for="regCompany"></span>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="regRole">Your role</label>
              <select id="regRole" name="role" required>
                <option value="">Select a role</option>
                <option value="Founder">Founder / CEO</option>
                <option value="Marketing">Marketing</option>
                <option value="Growth">Growth / Retention</option>
                <option value="Data">Data / Analytics</option>
                <option value="Product">Product</option>
                <option value="Other">Other</option>
              </select>
              <span class="field-error" data-for="regRole"></span>
            </div>
            <div class="form-group">
              <label for="regSize">Company size</label>
              <select id="regSize" name="size" required>
                <option value="">Select size</option>
                <option value="1-10">1–10</option>
                <option value="11-50">11–50</option>
                <option value="51-200">51–200</option>
                <option value="201-1000">201–1,000</option>
                <option value="1000+">1,000+</option>
              </select>
              <span class="field-error" data-for="regSize"></span>
            </div>
          </div>

          <div class="form-group">
            <label>Where does your customer data live?</label>
            <div class="chip-group" id="sourceChips">
              <button type="button" class="chip" data-value="Shopify">Shopify</button>
              <button type="button" class="chip" data-value="Stripe">Stripe</button>
              <button type="button" class="chip" data-value="HubSpot">HubSpot</button>
              <button type="button" class="chip" data-value="Segment">Segment</button>
              <button type="button" class="chip" data-value="BigQuery">BigQuery</button>
              <button type="button" class="chip" data-value="CSV">CSV Upload</button>
            </div>
          </div>

          <div class="step-actions step-actions-2">
            <button type="button" class="btn btn-outline" data-prev="1">Back</button>
            <button type="button" class="btn btn-primary" data-next="3">Continue</button>
          </div>
        </div>

        <!-- STEP 3 -->
        <div class="form-step" data-step="3">
          <p class="step-label">Choose your plan</p>
          <div class="plan-options">
            <label class="plan-option">
              <input type="radio" name="plan" value="Starter" />
              <div class="plan-option-body">
                <div class="plan-option-head"><strong>Starter</strong><span>$0/mo</span></div>
                <p>5,000 customers · 3 segments</p>
              </div>
            </label>
            <label class="plan-option">
              <input type="radio" name="plan" value="Growth" checked />
              <div class="plan-option-body">
                <div class="plan-option-head"><strong>Growth</strong><span>$49/mo</span></div>
                <p>100,000 customers · unlimited segments · predictive AI</p>
              </div>
            </label>
            <label class="plan-option">
              <input type="radio" name="plan" value="Enterprise" />
              <div class="plan-option-body">
                <div class="plan-option-head"><strong>Enterprise</strong><span>$199/mo</span></div>
                <p>Unlimited customers · custom models · SSO</p>
              </div>
            </label>
          </div>

          <label class="checkbox-row terms-row">
            <input type="checkbox" id="agreeTerms" required />
            <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</span>
          </label>
          <span class="field-error" data-for="agreeTerms"></span>

          <div class="step-actions step-actions-2">
            <button type="button" class="btn btn-outline" data-prev="2">Back</button>
            <button type="submit" class="btn btn-primary btn-lg">Create Account</button>
          </div>

          <div class="auth-alert" id="authAlert" role="alert"></div>
        </div>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
