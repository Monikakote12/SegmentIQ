<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — SegmentIQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-page">

  <div class="auth-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="grid-overlay"></div>
  </div>

  <a href="index.html" class="auth-back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    Back to home
  </a>

  <div class="auth-wrap">
    <div class="auth-brand">
      <a href="index.html" class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="10" cy="10" r="6" fill="#6366f1" opacity="0.9"/>
            <circle cx="23" cy="12" r="4.5" fill="#22d3ee" opacity="0.85"/>
            <circle cx="15" cy="23" r="5" fill="#a855f7" opacity="0.85"/>
            <circle cx="16" cy="16" r="1.6" fill="#fff"/>
          </svg>
        </span>
        <span class="brand-name">Segment<span class="brand-accent">IQ</span></span>
      </a>
    </div>

    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-sub">Sign in to your SegmentIQ workspace.</p>

      <button type="button" class="btn btn-demo btn-block" id="demoBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Enter Demo Account
      </button>

      <div class="divider"><span>or sign in with email</span></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail">Email address</label>
          <input type="email" id="loginEmail" name="email" placeholder="you@company.com" autocomplete="email" required />
          <span class="field-error" data-for="loginEmail"></span>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="loginPassword">Password</label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <div class="input-wrap">
            <input type="password" id="loginPassword" name="password" placeholder="Enter your password" autocomplete="current-password" required />
            <button type="button" class="toggle-pw" data-target="loginPassword" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="field-error" data-for="loginPassword"></span>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" id="rememberMe" />
          <span>Remember me for 30 days</span>
        </label>

        <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>

        <div class="auth-alert" id="authAlert" role="alert"></div>
      </form>

      <p class="auth-switch">Don't have an account? <a href="register.html">Create one free</a></p>
    </div>

    <div class="auth-demo-hint">
      <strong>Demo credentials</strong>
      <span>Email: <code>demo@segmentiq.io</code> · Password: <code>demo1234</code></span>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
